<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Dashboard</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6551032201404007" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .sidebar { transition: all 0.3s ease; width: 260px; background: #0b1120; border-right: 1px solid rgba(255,255,255,0.1); }
        #chat-main { flex: 1; display: flex; flex-col; height: 100vh; }
        .session-item:hover { background: rgba(255,255,255,0.05); }
        .active-session { background: rgba(59, 130, 246, 0.2) !important; color: #60a5fa; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex overflow-hidden">

    <!-- 1. SIDEBAR (CHAT HISTORY) -->
    <div id="sidebar" class="hidden md:flex sidebar flex-col p-4 h-screen">
        <button id="new-chat-btn" class="w-full border border-white/20 rounded-lg p-3 text-sm font-bold flex items-center gap-2 hover:bg-white/5 transition mb-6">
            <span>+</span> New Chat
        </button>
        <p class="text-[10px] text-gray-500 uppercase font-bold mb-4 tracking-widest">Recent History</p>
        <div id="sessions-list" class="flex-1 overflow-y-auto space-y-1">
            <!-- Sessions list injected here -->
        </div>
        <div class="mt-auto border-t border-white/10 pt-4 text-[10px] text-gray-500 text-center">Winter Arc v2.0</div>
    </div>

    <!-- 2. MAIN CONTENT -->
    <div id="chat-main" class="relative">
        <!-- Dashboard / Chat Switcher -->
        <div id="dashboard-view" class="h-full overflow-y-auto p-4 md:p-8 space-y-6">
            <!-- Header, Stats, Leaderboard, Checklist (Sab wahi jo pehle tha) -->
            <div class="max-w-3xl mx-auto space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-3xl font-black italic text-blue-400">WINTER ARC</h2>
                    <button id="show-chat-btn" class="bg-blue-600 px-4 py-2 rounded-full text-xs font-bold shadow-lg">Open AI Coach</button>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="glass-card p-4 rounded-2xl border-l-4 border-blue-500">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">Points</p>
                        <h3 id="user-points" class="text-2xl font-black text-blue-400">0</h3>
                    </div>
                    <div class="glass-card p-4 rounded-2xl border-l-4 border-orange-500 text-right">
                        <p class="text-[10px] text-gray-500 uppercase font-bold">Streak</p>
                        <h3 id="user-streak" class="text-2xl font-black text-orange-500">0 Days</h3>
                    </div>
                </div>

                <!-- Checklist Sync -->
                <div class="glass-card p-6 rounded-2xl">
                    <h3 class="text-lg font-bold text-emerald-500 mb-6 flex items-center gap-2">📋 Live Checklist</h3>
                    <div id="tasks-container" class="space-y-3"></div>
                </div>
            </div>
        </div>

        <!-- FULL SCREEN CHAT (ChatGPT Style) -->
        <div id="chat-view" class="hidden h-full flex flex-col bg-[#0f172a]">
            <div class="p-4 border-b border-white/10 flex justify-between items-center">
                <button id="back-to-dash" class="text-xs text-gray-400 font-bold hover:text-white">← Dashboard</button>
                <span id="current-chat-title" class="font-bold text-blue-400 italic">NEW CHAT</span>
                <button id="mobile-history-toggle" class="md:hidden text-xs text-blue-400">History</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 max-w-4xl mx-auto w-full">
                <!-- Messages injected here -->
            </div>
            <div class="p-4 md:p-8 bg-[#0f172a] border-t border-white/5">
                <div class="max-w-3xl mx-auto flex gap-4">
                    <input type="text" id="chat-input" placeholder="Ask AI Coach..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-6 py-4 text-sm focus:outline-none focus:border-blue-500 shadow-2xl">
                    <button id="send-btn" class="bg-blue-600 px-6 rounded-xl font-bold hover:bg-blue-700 transition transform active:scale-95">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDoc, setDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "1:564956254415:web:YOUR_ACTUAL_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = null;
        let currentSessionId = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await ensureUserExists(user);
                setupRealtimeUpdates(user.uid);
                listenToSessions(user.uid);
                // Start a new chat session if none selected
                if(!currentSessionId) createNewChat();
            } else {
                window.location.reload(); // Simple redirect to login logic
            }
        });

        // SESSION MANAGEMENT
        async function createNewChat() {
            const user = auth.currentUser;
            const newSession = await addDoc(collection(db, "users", user.uid, "sessions"), {
                title: "New Chat",
                timestamp: Date.now()
            });
            selectSession(newSession.id, "New Chat");
        }

        function listenToSessions(uid) {
            const q = query(collection(db, "users", uid, "sessions"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('sessions-list');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = `session-item p-3 text-xs rounded-lg cursor-pointer truncate ${doc.id === currentSessionId ? 'active-session' : ''}`;
                    item.innerText = data.title;
                    item.onclick = () => selectSession(doc.id, data.title);
                    list.appendChild(item);
                });
            });
        }

        function selectSession(id, title) {
            currentSessionId = id;
            document.getElementById('current-chat-title').innerText = title.toUpperCase();
            listenToMessages(id);
        }

        function listenToMessages(sid) {
            const q = query(collection(db, "users", auth.currentUser.uid, "sessions", sid, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    appendMessage(d.text, d.isUser);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        async function askCoach() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !currentSessionId) return;
            
            input.value = '';
            const uid = auth.currentUser.uid;
            const msgRef = collection(db, "users", uid, "sessions", currentSessionId, "messages");
            
            // Save User Message
            await addDoc(msgRef, { text: msg, isUser: true, timestamp: Date.now() });

            // Call AI
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 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', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama3-70b-8192",
                        messages: [{ role: "user", content: msg }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                // Save AI Reply
                await addDoc(msgRef, { text: reply, isUser: false, timestamp: Date.now() });
                
                // Update Session Title if it's the first message
                updateDoc(doc(db, "users", uid, "sessions", currentSessionId), { title: msg.substring(0, 20) + "..." });
            } catch (e) { console.error(e); }
        }

        // UTILS
        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'self-end bg-blue-600 p-4 rounded-2xl rounded-tr-none max-w-[80%]' : 'self-start bg-white/5 p-4 rounded-2xl rounded-tl-none max-w-[80%] border border-white/10';
            div.innerText = text;
            document.getElementById('chat-messages').appendChild(div);
        }

        document.getElementById('send-btn').onclick = askCoach;
        document.getElementById('new-chat-btn').onclick = createNewChat;
        document.getElementById('show-chat-btn').onclick = () => {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('chat-view').classList.remove('hidden');
        };
        document.getElementById('back-to-dash').onclick = () => {
            document.getElementById('chat-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('hidden');
        };
        
        // Checklist logic (same as before) fetch from Firestore config...
    </script>
</body>
</html>
