<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winter Arc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; font-size: 11px; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .task-card { border-left: 3px solid transparent; transition: 0.2s; margin-bottom: 6px; padding: 10px; }
        .done { border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        #chat-window { position: fixed; bottom: 80px; right: 20px; width: 280px; height: 380px; z-index: 100; transition: 0.3s; transform: translateY(20px); opacity: 0; pointer-events: none; }
        #chat-window.active { transform: translateY(0); opacity: 1; pointer-events: all; }
        .chat-bubble { padding: 8px 12px; border-radius: 12px; max-width: 85%; margin-bottom: 8px; font-size: 10px; line-height: 1.4; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 flex flex-col items-center">

    <!-- COMPACT DASHBOARD -->
    <div class="w-full max-w-sm space-y-4 pb-20">
        <div class="flex justify-between items-center">
            <h1 class="text-base font-black italic text-blue-500 tracking-tighter uppercase">Winter Arc</h1>
            <button id="logout-btn" class="text-[8px] text-red-500 opacity-40 uppercase font-bold">Logout</button>
        </div>

        <!-- PROFILE CARD (SMALLER) -->
        <div class="glass p-4 rounded-2xl border-l-4 border-blue-500 flex justify-between items-center shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 flex items-center justify-center text-xl font-black text-blue-400" id="user-initial">W</div>
                <div>
                    <div class="flex items-center gap-1">
                        <span id="user-name" class="font-bold text-xs truncate max-w-[80px]">Warrior</span>
                        <button id="edit-name-btn" class="text-[7px] text-blue-400 border border-blue-400/20 px-1 rounded">Edit</button>
                    </div>
                    <div class="text-[9px] text-yellow-500 font-black tracking-widest"><span id="user-points">0</span> PTS</div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[7px] text-gray-500 font-black uppercase">Streak 🔥</div>
                <div id="user-streak" class="text-base font-black text-orange-500">0 Days</div>
            </div>
        </div>

        <!-- ADS -->
        <div class="glass p-1 rounded-xl min-h-[50px] flex items-center justify-center text-[7px] text-gray-700">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6551032201404007" data-ad-slot="1234567890" data-ad-format="auto"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <!-- LEADERBOARD (MINI) -->
        <div class="glass p-3 rounded-2xl">
            <h3 class="text-[9px] font-black text-yellow-500 uppercase mb-2 tracking-widest">🏆 Top Warriors</h3>
            <table class="w-full text-left text-[9px]"><tbody id="leaderboard-body"></tbody></table>
        </div>

        <!-- CHECKLIST -->
        <h3 class="text-[9px] font-black text-emerald-500 uppercase tracking-widest mt-4">📋 Daily Checklist</h3>
        <div id="tasks-container" class="space-y-1"></div>
    </div>

    <!-- AI CHAT WINDOW -->
    <div id="chat-window" class="glass rounded-2xl flex flex-col shadow-2xl overflow-hidden border border-blue-500/20">
        <div class="bg-blue-600/10 p-3 border-b border-white/5 flex justify-between items-center">
            <span class="font-black italic text-blue-400 text-[10px]">ARC COACH AI</span>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-3 flex flex-col">
            <div class="chat-bubble self-start bg-white/5 text-gray-300">Warrior, focus karo. Kya help chahiye?</div>
        </div>
        <div class="p-2 bg-slate-900/50 flex gap-2 border-t border-white/5">
            <input type="text" id="chat-input" placeholder="Ask coach..." class="flex-1 bg-white/5 rounded-lg px-3 py-1.5 text-[10px] focus:outline-none border border-white/5">
            <button id="send-btn" class="bg-blue-600 px-3 rounded-lg text-xs">➤</button>
        </div>
    </div>

    <!-- FLOAT BUTTON -->
    <button id="chat-toggle" class="fixed bottom-6 right-6 bg-blue-600 w-12 h-12 rounded-full flex items-center justify-center shadow-2xl hover:scale-105 active:scale-95 z-50 text-xl">🤖</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDoc, setDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "1:564956254415:web:YOUR_ACTUAL_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = null;
        let rules = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await syncUser(user);
                onSnapshot(doc(db, "config", "active_challenge"), (s) => { rules = s.data().rules || []; updateUI(); });
                onSnapshot(doc(db, "users", user.uid), (s) => { 
                    userProfile = s.data(); 
                    document.getElementById('user-points').innerText = userProfile.points;
                    document.getElementById('user-streak').innerText = userProfile.streak;
                    document.getElementById('user-name').innerText = userProfile.name;
                    document.getElementById('user-initial').innerText = userProfile.name.charAt(0).toUpperCase();
                    updateUI(); 
                });
                syncRanks();
            } else { signInWithPopup(auth, new GoogleAuthProvider()); }
        });

        async function syncUser(user) {
            const ref = doc(db, "users", user.uid);
            const s = await getDoc(ref);
            if (!s.exists()) await setDoc(ref, { uid: user.uid, name: user.displayName || "Warrior", points: 0, streak: 0, dailyTaskCounts: {} });
        }

        function updateUI() {
            const container = document.getElementById('tasks-container');
            if(!rules.length) return;
            container.innerHTML = '';
            const today = new Date().getDate().toString();
            const count = (userProfile?.dailyTaskCounts || {})[today] || 0;
            rules.forEach((r, i) => {
                const done = i < count;
                container.innerHTML += `<div class="task-card glass rounded-xl flex justify-between items-center ${done ? 'done' : ''}"><div class="font-bold text-gray-300 uppercase text-[10px]">${r.text}</div><div class="text-[9px] font-black opacity-40">${done ? '✓' : 'WAIT'}</div></div>`;
            });
        }

        async function askCoach() {
            const i = document.getElementById('chat-input');
            const msg = i.value.trim();
            if(!msg || !userProfile) return;
            
            appendMsg(msg, true);
            i.value = '';
            const loaderId = 'L-' + Date.now();
            appendMsg("...", false, loaderId);

            try {
                // FIXED PROXY CALL (Direct Groq might be CORS blocked)
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 
                        'Authorization': 'Bearer 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',
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({
                        model: "llama3-8b-8192", 
                        messages: [{ role: "user", content: `Speak Hinglish as ARC COACH. User: ${userProfile.name}. Msg: ${msg}` }]
                    })
                });
                const d = await res.json();
                document.getElementById(loaderId).innerText = d.choices[0].message.content;
            } catch (e) { document.getElementById(loaderId).innerText = "Coach is busy (CORS/Key). Try App!"; }
        }

        function appendMsg(t, u, id) {
            const d = document.createElement('div');
            d.className = `chat-bubble ${u ? 'self-end bg-blue-600' : 'self-start bg-white/10 border border-white/5'}`;
            if(id) d.id = id;
            d.innerText = t;
            const c = document.getElementById('chat-messages'); c.appendChild(d); c.scrollTop = c.scrollHeight;
        }

        function syncRanks() {
            onSnapshot(query(collection(db, "users"), orderBy("points", "desc"), limit(5)), (snap) => {
                const b = document.getElementById('leaderboard-body'); b.innerHTML = '';
                let r = 1; snap.forEach(d => {
                    b.innerHTML += `<tr class="border-b border-white/5"><td class="py-2 text-blue-500 font-bold">#${r}</td><td class="font-bold text-gray-300">${d.data().name}</td><td class="text-right font-black opacity-40">${d.data().points} P</td></tr>`;
                    r++;
                });
            });
        }

        document.getElementById('chat-toggle').onclick = () => document.getElementById('chat-window').classList.toggle('active');
        document.getElementById('send-btn').onclick = askCoach;
        document.getElementById('edit-name-btn').onclick = async () => { const n = prompt("Name:", userProfile.name); if(n) await updateDoc(doc(db, "users", auth.currentUser.uid), { name: n.trim() }); };
        document.getElementById('logout-btn').onclick = () => signOut(auth);
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key==='Enter') askCoach(); };
    </script>
</body>
</html>
