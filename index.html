<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Dashboard</title>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6551032201404007" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; overflow: hidden; font-size: 13px; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .bottom-nav { background: #0b1120; border-top: 1px solid rgba(255,255,255,0.1); position: fixed; bottom: 0; width: 100%; height: 65px; z-index: 100; display: flex; justify-content: space-around; align-items: center; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; opacity: 0.5; font-size: 10px; font-weight: bold; }
        .nav-btn.active { opacity: 1; color: #3b82f6; }
        .screen { display: none; height: calc(100vh - 65px); overflow-y: auto; padding: 15px; }
        .screen.active { display: block; }
        .task-card { border-left: 3px solid transparent; margin-bottom: 8px; }
        .task-completed { border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.08); }
        .task-active { border-left-color: #22c55e; background: rgba(34, 197, 94, 0.08); }
        .chat-bubble { padding: 10px 14px; border-radius: 18px; max-width: 85%; line-height: 1.4; margin-bottom: 10px; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-slate-950">

    <!-- 1. DASHBOARD SCREEN -->
    <div id="screen-home" class="screen active max-w-lg mx-auto pb-20">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-black italic text-blue-500 uppercase">Winter Arc</h1>
            <button id="logout-btn" class="text-[9px] text-red-500 opacity-40">Logout</button>
        </div>

        <!-- Compact Profile Card -->
        <div class="glass-card p-4 rounded-2xl mb-4 border-l-4 border-blue-500 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 flex items-center justify-center text-xl font-black text-blue-400" id="user-initial">?</div>
                <div>
                    <div class="flex items-center gap-2">
                        <span id="user-name" class="font-bold text-sm">Warrior</span>
                        <button id="edit-name-btn" class="text-[8px] text-blue-400 border border-blue-400/20 px-1 rounded">Edit</button>
                    </div>
                    <p class="text-[10px] text-yellow-500 font-bold tracking-widest"><span id="user-points">0</span> PTS</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[9px] text-gray-500 uppercase block font-bold">Streak 🔥</span>
                <span id="user-streak" class="text-lg font-black text-orange-500">0 Days</span>
            </div>
        </div>

        <!-- Ad Slot -->
        <div class="glass-card p-1 rounded-xl min-h-[60px] flex items-center justify-center mb-6 text-[8px] text-gray-700">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6551032201404007" data-ad-slot="1234567890" data-ad-format="auto"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

        <h3 class="text-xs font-black text-emerald-500 mb-4 uppercase tracking-tighter">📋 Checklist</h3>
        <div id="tasks-container" class="space-y-2"></div>
    </div>

    <!-- 2. LEADERBOARD SCREEN -->
    <div id="screen-ranks" class="screen max-w-lg mx-auto pb-20">
        <h2 class="text-lg font-black text-yellow-500 uppercase mb-6 flex items-center gap-2">🏆 Leaderboard</h2>
        <div class="glass-card rounded-2xl overflow-hidden">
            <table class="w-full text-left text-xs">
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 3. AI COACH SCREEN -->
    <div id="screen-ai" class="screen max-w-lg mx-auto h-screen flex flex-col p-0">
        <div class="p-4 border-b border-white/5 flex justify-between items-center bg-slate-900/50">
            <span class="font-black italic text-blue-400 text-xs">ARC COACH AI</span>
            <span class="text-[8px] text-emerald-500 font-bold bg-emerald-500/10 px-2 rounded-full tracking-widest">LIVE</span>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col">
            <!-- Messages load here -->
        </div>
        <div class="p-3 bg-slate-900/50 border-t border-white/5 flex gap-2">
            <input type="text" id="chat-input" placeholder="Ask Warrior coach..." class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs focus:outline-none">
            <button id="send-btn" class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center">➤</button>
        </div>
    </div>

    <!-- 4. HISTORY SCREEN -->
    <div id="screen-history" class="screen max-w-lg mx-auto pb-20">
        <h2 class="text-lg font-black text-blue-500 uppercase mb-6 flex items-center gap-2">📜 Chat History</h2>
        <button id="new-chat-btn" class="w-full bg-blue-600/10 border border-blue-500/20 rounded-xl p-3 text-xs font-bold mb-4 hover:bg-blue-600/20 transition">+ NEW CHAT SESSION</button>
        <div id="sessions-list" class="space-y-2">
            <!-- History sessions injected here -->
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <div class="nav-btn active" onclick="showScreen('home')"><span>🏠</span><span>Home</span></div>
        <div class="nav-btn" onclick="showScreen('ranks')"><span>🏆</span><span>Ranks</span></div>
        <div class="nav-btn" onclick="showScreen('ai')"><span>🤖</span><span>AI Coach</span></div>
        <div class="nav-btn" onclick="showScreen('history')"><span>📜</span><span>History</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDoc, setDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "1:564956254415:web:YOUR_ACTUAL_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = null;
        let currentSessionId = null;
        let activeRules = [];
        let msgListener = null;

        // AUTH
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await ensureUserExists(user);
                setupRealtimeSync(user.uid);
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        async function ensureUserExists(user) {
            const userRef = doc(db, "users", user.uid);
            const s = await getDoc(userRef);
            if (!s.exists()) {
                await setDoc(userRef, { uid: user.uid, name: user.displayName || "Warrior", points: 0, streak: 0, dailyTaskCounts: {} });
            }
        }

        function setupRealtimeSync(uid) {
            // Rules
            onSnapshot(doc(db, "config", "active_challenge"), (s) => { activeRules = s.data().rules || []; renderHome(); });
            // Profile
            onSnapshot(doc(db, "users", uid), (s) => { 
                userProfile = s.data(); 
                document.getElementById('user-name').innerText = userProfile.name;
                document.getElementById('user-initial').innerText = userProfile.name.charAt(0).toUpperCase();
                document.getElementById('user-points').innerText = userProfile.points;
                document.getElementById('user-streak').innerText = userProfile.streak;
                renderHome();
            });
            // Sessions & Leaderboard
            listenToSessions(uid);
            setupLeaderboard();
        }

        // NAVIGATION LOGIC
        window.showScreen = (name) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('screen-' + name).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        // HOME RENDER
        function renderHome() {
            const container = document.getElementById('tasks-container');
            if (!activeRules.length) return;
            container.innerHTML = '';
            const today = new Date().getDate().toString();
            const count = (userProfile?.dailyTaskCounts || {})[today] || 0;
            activeRules.forEach((rule, i) => {
                const isDone = i < count;
                container.innerHTML += `<div class="task-card glass-card ${isDone ? 'task-completed' : ''} p-3 rounded-xl flex justify-between items-center text-xs"><div><h4 class="font-bold text-gray-200 uppercase">${rule.text}</h4><p class="text-[8px] text-gray-500 mt-0.5">${rule.startTime} - ${rule.endTime}</p></div><div class="font-black text-[9px] opacity-60">${isDone ? '✓ DONE' : 'WAIT'}</div></div>`;
            });
        }

        // HISTORY & SESSIONS
        function listenToSessions(uid) {
            const q = query(collection(db, "users", uid, "sessions"), orderBy("timestamp", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('sessions-list');
                list.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const item = document.createElement('div');
                    item.className = `glass-card p-3 rounded-xl cursor-pointer text-xs font-medium border-l-4 ${doc.id === currentSessionId ? 'border-blue-500' : 'border-transparent'}`;
                    item.innerText = "💬 " + d.title;
                    item.onclick = () => { currentSessionId = doc.id; listenToMessages(doc.id); showScreen('ai'); };
                    list.appendChild(item);
                });
            });
        }

        function listenToMessages(sid) {
            if(msgListener) msgListener();
            const q = query(collection(db, "users", auth.currentUser.uid, "sessions", sid, "messages"), orderBy("timestamp", "asc"));
            msgListener = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-messages');
                container.innerHTML = '';
                snapshot.forEach(doc => {
                    const d = doc.data();
                    const div = document.createElement('div');
                    div.className = d.isUser ? 'chat-bubble self-end bg-blue-600 text-white text-[12px]' : 'chat-bubble self-start bg-white/5 border border-white/10 text-[12px]';
                    div.innerText = d.text;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        async function askCoach() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg || !userProfile) return;

            const uid = auth.currentUser.uid;
            if(!currentSessionId) {
                const newS = await addDoc(collection(db, "users", uid, "sessions"), { title: msg.substring(0, 15), timestamp: Date.now() });
                currentSessionId = newS.id;
                listenToMessages(newS.id);
            }

            input.value = '';
            const msgRef = collection(db, "users", uid, "sessions", currentSessionId, "messages");
            await addDoc(msgRef, { text: msg, isUser: true, timestamp: Date.now() });

            try {
                // FIXED AI REQUEST (CORS Handling)
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 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', 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: "llama3-70b-8192", 
                        messages: [{ role: "user", content: `You are ARC COACH. Talk in Hinglish like an aggressive fitness coach. User ${userProfile.name}. Message: ${msg}` }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                await addDoc(msgRef, { text: reply, isUser: false, timestamp: Date.now() });
                updateDoc(doc(db, "users", uid, "sessions", currentSessionId), { title: msg.substring(0, 15) });
            } catch (e) { 
                console.error(e);
                appendMessage("Coach is busy, try in a minute!", false); 
            }
        }

        // Leaderboard
        function setupLeaderboard() {
            onSnapshot(query(collection(db, "users"), orderBy("points", "desc"), limit(10)), (snap) => {
                const b = document.getElementById('leaderboard-body'); b.innerHTML = '';
                let r = 1; snap.forEach(d => {
                    b.innerHTML += `<tr class="border-b border-white/5"><td class="py-3 px-4 font-black text-blue-400">#${r}</td><td class="font-bold">${d.data().name}</td><td class="text-right px-4 font-black opacity-60">${d.data().points} P</td></tr>`;
                    r++;
                });
            });
        }

        document.getElementById('send-btn').onclick = askCoach;
        document.getElementById('new-chat-btn').onclick = () => { currentSessionId = null; showScreen('ai'); document.getElementById('chat-messages').innerHTML = ''; };
        document.getElementById('edit-name-btn').onclick = async () => { const n = prompt("Name:", userProfile.name); if(n) await updateDoc(doc(db, "users", auth.currentUser.uid), { name: n.trim() }); };
        document.getElementById('logout-btn').onclick = () => signOut(auth);
        document.getElementById('chat-input').onkeydown = (e) => { if(e.key==='Enter') askCoach(); };
    </script>
</body>
</html>
