<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Dashboard</title>
    
    <!-- GOOGLE ADSENSE VERIFICATION CODE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6551032201404007"
     crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .task-card { transition: all 0.3s ease; }
        .task-active { border-left: 4px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
        .task-completed { border-left: 4px solid #3b82f6; background: rgba(59, 130, 246, 0.1); }
        .task-expired { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.1); opacity: 0.6; }
        .leaderboard-row:nth-child(1) { color: #facc15; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="auth-section" class="flex flex-col items-center justify-center h-screen text-center">
        <h1 class="text-5xl font-black mb-4 text-blue-500 italic">WINTER ARC</h1>
        <p class="text-gray-400 mb-8">Official Web Dashboard</p>
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-4 rounded-full font-bold shadow-lg transition">
            Start Your Journey
        </button>
    </div>

    <div id="dashboard-section" class="hidden max-w-2xl mx-auto space-y-6 pb-20">
        <!-- Header -->
        <div class="flex justify-between items-center">
            <h2 class="text-3xl font-black italic text-blue-400">WINTER ARC</h2>
            <button id="logout-btn" class="text-xs text-red-400 opacity-50 border border-red-400/30 px-2 py-1 rounded">Logout</button>
        </div>

        <!-- Banner Ad Slot (DON'T CHANGE THIS) -->
        <div class="glass-card p-2 rounded-2xl overflow-hidden min-h-[90px] flex items-center justify-center bg-white/5">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-6551032201404007"
                 data-ad-slot="1234567890"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <!-- Timer -->
        <div class="bg-emerald-600/10 border border-emerald-500/30 p-6 rounded-2xl text-center">
            <p class="text-gray-400 text-[10px] font-bold tracking-widest uppercase mb-2">Challenge Starts In</p>
            <h3 id="countdown-timer" class="text-xl md:text-2xl font-mono font-black text-emerald-500">00d : 00h : 00m : 00s</h3>
        </div>

        <!-- Leaderboard -->
        <div class="glass-card p-6 rounded-2xl">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-yellow-500 text-xl">🏆</span>
                <h3 class="text-lg font-bold text-yellow-500 uppercase">Top Warriors</h3>
            </div>
            <table class="w-full text-left text-sm">
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>

        <!-- User Stats (Updated with Edit Button) -->
        <div class="glass-card p-6 rounded-2xl flex items-center justify-between border-l-4 border-blue-500">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center text-xl font-bold text-blue-400" id="user-initial">?</div>
                <div>
                    <div class="flex items-center gap-2">
                        <h3 id="user-name" class="font-bold">Warrior</h3>
                        <button id="edit-name-btn" class="text-[9px] text-blue-400 border border-blue-400/30 px-1.5 py-0.5 rounded hover:bg-blue-400/10">Edit</button>
                    </div>
                    <p class="text-sm text-yellow-500 font-bold"><span id="user-points">0</span> Points</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-500 uppercase">Streak 🔥</p>
                <p id="user-streak" class="text-xl font-black text-orange-500">0 Days</p>
            </div>
        </div>

        <!-- Tasks -->
        <div class="glass-card p-6 rounded-2xl">
            <h3 class="text-lg font-bold text-emerald-500 mb-6 flex items-center gap-2">📋 Daily Checklist</h3>
            <div id="tasks-container" class="space-y-3"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "1:564956254415:web:YOUR_ACTUAL_APP_ID" // <- IMPORTANT: Apni Web App ID yahan daalein
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const rules = [
            { id: 1, text: "Wake Up (No Snooze)", start: "05:00", end: "05:10" },
            { id: 2, text: "Cold Shower", start: "05:15", end: "05:30" },
            { id: 3, text: "Morning Running/Exercise", start: "06:00", end: "07:00" },
            { id: 4, text: "Deep Work / Learning Skill", start: "09:00", end: "11:00" },
            { id: 5, text: "Healthy Lunch (No Phone)", start: "13:00", end: "13:30" },
            { id: 6, text: "Study Session", start: "15:00", end: "17:00" },
            { id: 7, text: "Calisthenics / Gym", start: "18:00", end: "19:00" },
            { id: 8, text: "Digital Detox (No Phone)", start: "20:00", end: "21:00" },
            { id: 9, text: "Plan for Tomorrow", start: "21:30", end: "21:45" },
            { id: 10, text: "Sleep Early", start: "22:00", end: "22:15" }
        ];

        // LOGIC: New User Handling & UI setup
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Taaki naya user leaderboard mein dikhe
                await ensureUserExists(user);
                
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
                setupRealtimeUpdates(user.uid);
                setupLeaderboard();
            } else {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
            }
        });

        async function ensureUserExists(user) {
            const userRef = doc(db, "users", user.uid);
            const snap = await getDoc(userRef);
            if (!snap.exists()) {
                await setDoc(userRef, {
                    uid: user.uid,
                    name: user.displayName || "Warrior",
                    email: user.email || "",
                    points: 0,
                    streak: 0,
                    lastAttendanceDate: 0,
                    attendance: {},
                    dailyTaskCounts: {}
                });
            }
        }

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // Edit Name Logic
        document.getElementById('edit-name-btn').onclick = async () => {
            const currentName = document.getElementById('user-name').innerText;
            const newName = prompt("Enter your Warrior Name:", currentName);
            if (newName && newName.trim() !== "" && newName !== currentName) {
                const user = auth.currentUser;
                if (user) {
                    await updateDoc(doc(db, "users", user.uid), { name: newName.trim() });
                }
            }
        };

        function setupLeaderboard() {
            const q = query(collection(db, "users"), orderBy("points", "desc"), limit(10));
            onSnapshot(q, (snapshot) => {
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    tbody.innerHTML += `<tr class="leaderboard-row border-b border-white/5"><td class="py-3 font-bold">#${rank}</td><td class="py-3">${data.name || 'Unknown'}</td><td class="py-3 text-right text-gray-300 font-bold">${data.points || 0}</td></tr>`;
                    rank++;
                });
            });
        }

        function setupRealtimeUpdates(uid) {
            onSnapshot(doc(db, "users", uid), (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    document.getElementById('user-name').innerText = data.name || 'Warrior';
                    document.getElementById('user-initial').innerText = (data.name || 'W').charAt(0).toUpperCase();
                    document.getElementById('user-points').innerText = data.points || 0;
                    document.getElementById('user-streak').innerText = (data.streak || 0) + " Days";
                    
                    // Task logic needs to match your App's data structure
                    renderTasks(data.dailyTaskCounts || {});
                }
            });
        }

        function renderTasks(dailyTaskCounts) {
            const container = document.getElementById('tasks-container');
            container.innerHTML = '';
            const now = new Date();
            const currentMins = now.getHours() * 60 + now.getMinutes();
            const today = now.getDate().toString();

            rules.forEach(rule => {
                const [sH, sM] = rule.start.split(':').map(Number);
                const [eH, eM] = rule.end.split(':').map(Number);
                const startMins = sH * 60 + sM;
                const endMins = eH * 60 + eM;
                
                // Note: Agar aapka app rule ID nahi bhej raha toh ye logic thoda adjust karna padega
                const isCompleted = dailyTaskCounts[today] >= rule.id; // Example logic
                const isActive = currentMins >= startMins && currentMins <= endMins;
                const isExpired = currentMins > endMins && !isCompleted;
                
                let cardClass = isCompleted ? "task-completed" : isActive ? "task-active" : isExpired ? "task-expired" : "";
                const statusText = isCompleted ? '✓ Completed' : isActive ? '● Active Now' : isExpired ? '✕ Missed' : 'Pending';

                container.innerHTML += `
                    <div class="task-card glass-card ${cardClass} p-4 rounded-xl flex justify-between items-center text-sm border-l-4 border-transparent">
                        <div>
                            <h4 class="font-bold text-gray-100">${rule.text}</h4>
                            <p class="text-[10px] text-gray-400 font-mono tracking-tighter">${rule.start} - ${rule.end}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-black uppercase ${isCompleted ? 'text-blue-400' : isActive ? 'text-emerald-400' : 'text-gray-500'}">${statusText}</p>
                        </div>
                    </div>`;
            });
        }

        function updateTimer() {
            const target = new Date(2026, 8, 1); // Sept 1, 2026
            const diff = target - new Date();
            if (diff > 0) {
                const d = Math.floor(diff/86400000); 
                const h = Math.floor((diff/3600000)%24); 
                const m = Math.floor((diff/60000)%60); 
                const s = Math.floor((diff/1000)%60);
                document.getElementById('countdown-timer').innerText = `${d}d : ${h}h : ${m}m : ${s}s`;
            } else {
                document.getElementById('countdown-timer').innerText = "WINTER ARC IS LIVE!";
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();
    </script>
</body>
</html>
