<script type="module">
    // ... (Imports same rahenge) ...

    const firebaseConfig = {
        // ... (Apni config daalein) ...
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Global variables taaki rules aur user data sync rahein
    let currentRules = []; 
    let userTaskCounts = {};

    onAuthStateChanged(auth, async (user) => {
        document.getElementById('loading-section').classList.add('hidden');
        if (user) {
            await ensureUserExists(user);
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            
            // 1. Listen to Firestore Rules (CONFIG)
            listenToChallengeConfig();
            
            // 2. Listen to User Data
            setupRealtimeUpdates(user.uid);
            
            setupLeaderboard();
        } else {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    });

    // FIREBASE SE RULES FETCH KARNE WALA FUNCTION
    function listenToChallengeConfig() {
        onSnapshot(doc(db, "config", "active_challenge"), (snapshot) => {
            if (snapshot.exists()) {
                const config = snapshot.data();
                if (config.rules && config.rules.length > 0) {
                    currentRules = config.rules; // Firestore ke rules yahan se milenge
                    renderTasks(); // Rules milte hi UI update karo
                }
            }
        });
    }

    function setupRealtimeUpdates(uid) {
        onSnapshot(doc(db, "users", uid), (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                userTaskCounts = data.dailyTaskCounts || {};
                document.getElementById('user-points').innerText = data.points || 0;
                document.getElementById('user-streak').innerText = (data.streak || 0) + " Days";
                renderTasks(); // User data badalte hi UI update karo
            }
        });
    }

    function renderTasks() {
        const container = document.getElementById('tasks-container');
        if (!currentRules || currentRules.length === 0) {
            container.innerHTML = '<p class="text-gray-500 text-center text-xs">Fetching rules from Firestore...</p>';
            return;
        }

        container.innerHTML = '';
        const today = new Date().getDate().toString();
        const currentMins = new Date().getHours() * 60 + new Date().getMinutes();
        const completedCount = userTaskCounts[today] || 0;

        currentRules.forEach((rule, index) => {
            // Firestore data structure ke hisab se mapping (id, text, startTime, endTime)
            const [sH, sM] = (rule.startTime || "00:00").split(':').map(Number);
            const [eH, eM] = (rule.endTime || "00:00").split(':').map(Number);
            const start = sH * 60 + sM;
            const end = eH * 60 + eM;
            
            // App logic: index-based completion ya rule.id-based
            const isCompleted = index < completedCount; 
            const isActive = currentMins >= start && currentMins <= end;
            const isExpired = currentMins > end && !isCompleted;

            let cls = isCompleted ? "task-completed" : isActive ? "task-active" : isExpired ? "task-expired" : "";
            const status = isCompleted ? 'DONE' : isActive ? 'ACTIVE' : isExpired ? 'MISSED' : 'PENDING';

            container.innerHTML += `
                <div class="task-card glass-card ${cls} p-4 rounded-xl flex justify-between items-center text-xs mb-3 border-l-4 border-transparent">
                    <div>
                        <h4 class="font-bold text-gray-100">${rule.text}</h4>
                        <p class="text-[9px] text-gray-500 font-mono">${rule.startTime} - ${rule.endTime}</p>
                    </div>
                    <div class="font-black text-[9px] tracking-widest">${status}</div>
                </div>`;
        });
    }

    // ... (AI Chat aur Leaderboard functions same rahenge) ...
</script>
