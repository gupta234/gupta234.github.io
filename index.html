<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Arc Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .day-box { width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .present { background-color: #22c55e; } /* Green */
        .absent { background-color: #ef4444; }  /* Red */
        .empty { background-color: #334155; }   /* Gray */
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="auth-section" class="flex flex-col items-center justify-center h-screen">
        <h1 class="text-4xl font-bold mb-8 text-blue-400">Winter Arc</h1>
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-full font-bold transition">
            Login to Dashboard
        </button>
    </div>

    <div id="dashboard-section" class="hidden max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h2 class="text-2xl font-bold">Hello, <span id="user-name" class="text-blue-400">User</span>!</h2>
                <p class="text-gray-400">Keep up the momentum ❄️</p>
            </div>
            <button id="logout-btn" class="text-sm text-red-400 border border-red-400 px-3 py-1 rounded">Logout</button>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="glass-card p-6 rounded-2xl text-center">
                <p class="text-gray-400 text-sm">Total Points</p>
                <h3 id="user-points" class="text-3xl font-bold text-yellow-500">0</h3>
            </div>
            <div class="glass-card p-6 rounded-2xl text-center">
                <p class="text-gray-400 text-sm">Current Streak</p>
                <h3 id="user-streak" class="text-3xl font-bold text-orange-500">0 Days</h3>
            </div>
        </div>

        <!-- Attendance / 30 Day Challenge -->
        <div class="glass-card p-6 rounded-2xl mb-8">
            <h3 class="text-xl font-bold mb-4">30-Day Attendance</h3>
            <div id="attendance-grid" class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                <!-- Days will be generated by JS -->
            </div>
        </div>

        <!-- Daily Tasks Summary -->
        <div class="glass-card p-6 rounded-2xl">
            <h3 class="text-xl font-bold mb-4">Daily Activity</h3>
            <div id="tasks-list" class="space-y-2">
                <p class="text-gray-400">Fetching latest tasks...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "YOUR_WEB_APP_ID" // <- APNI ID YAHAN DAALEIN
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // UI Elements
        const authSection = document.getElementById('auth-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const attendanceGrid = document.getElementById('attendance-grid');

        // Check Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                loadUserData(user.uid);
            } else {
                authSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });

        // Login / Logout
        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());
        document.getElementById('logout-btn').onclick = () => signOut(auth);

        function loadUserData(uid) {
            // Real-time updates (Jaise Android mein hota hai)
            onSnapshot(doc(db, "users", uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('user-name').innerText = data.name || "Warrior";
                    document.getElementById('user-points').innerText = data.points || 0;
                    document.getElementById('user-streak').innerText = (data.streak || 0) + " Days";
                    
                    renderAttendance(data.attendance || {});
                }
            });
        }

        function renderAttendance(attendanceMap) {
            attendanceGrid.innerHTML = '';
            for (let i = 1; i <= 30; i++) {
                const status = attendanceMap[i.toString()] || "";
                let statusClass = "empty";
                if (status === "present") statusClass = "present";
                if (status === "absent") statusClass = "absent";
                
                attendanceGrid.innerHTML += `<div class="day-box ${statusClass}">${i}</div>`;
            }
        }
    </script>
</body>
</html>
