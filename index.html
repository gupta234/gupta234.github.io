<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Winter Arc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; font-size: 12px; }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 60px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; z-index: 100; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.4; font-size: 9px; font-weight: 800; }
        .nav-item.active { opacity: 1; color: #3b82f6; }
        .screen { display: none; height: calc(100vh - 60px); overflow-y: auto; padding: 12px; }
        .screen.active { display: block; }
        .task-card { border-left: 3px solid transparent; transition: 0.2s; }
        .done { border-left-color: #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .chat-bubble { padding: 8px 12px; border-radius: 15px; max-width: 85%; margin-bottom: 8px; font-size: 11px; }
        input { font-size: 16px !important; } /* Prevents iOS zoom */
    </style>
</head>
<body>

    <!-- 1. HOME -->
    <div id="home" class="screen active max-w-md mx-auto">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-lg font-black italic text-blue-500 tracking-tighter uppercase">Winter Arc</h1>
            <div class="text-[10px] text-gray-500 font-bold" id="user-name-display">Warrior</div>
        </div>

        <div class="glass p-4 rounded-2xl mb-4 border-l-4 border-blue-500 flex justify-between items-center shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/20 flex items-center justify-center text-xl font-black text-blue-400" id="user-initial">W</div>
                <div>
                    <div class="text-xs font-black text-yellow-500 tracking-widest"><span id="user-points">0</span> PTS</div>
                    <div class="text-[9px] text-gray-500">Global Rank: --</div>
                </div>
            </div>
            <div class="text-right">
                <div class="text-[8px] text-gray-500 font-black uppercase">Streak 🔥</div>
                <div id="user-streak" class="text-lg font-black text-orange-500">0</div>
            </div>
        </div>

        <h3 class="text-[10px] font-black text-emerald-500 mb-3 uppercase tracking-widest">📋 Checklist</h3>
        <div id="tasks-container" class="space-y-2"></div>
    </div>

    <!-- 2. RANKS -->
    <div id="ranks" class="screen max-w-md mx-auto">
        <h2 class="text-sm font-black text-yellow-500 uppercase mb-4 tracking-widest text-center">🏆 Leaderboard</h2>
        <div class="glass rounded-xl overflow-hidden shadow-2xl">
            <table class="w-full text-left text-[10px]"><tbody id="leaderboard-body"></tbody></table>
        </div>
    </div>

    <!-- 3. AI COACH -->
    <div id="ai" class="screen max-w-md mx-auto flex flex-col p-0 bg-[#020617]">
        <div class="p-3 border-b border-white/5 bg-[#0f172a] text-center">
            <span class="text-[10px] font-black italic text-blue-400">ARC COACH AI</span>
        </div>
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 flex flex-col">
            <div class="chat-bubble self-start bg-white/5">Warrior, winter arc mein rukna mana hai. Kya madad chahiye?</div>
        </div>
        <div class="p-3 bg-[#0f172a] flex gap-2 border-t border-white/5">
            <input type="text" id="chat-input" placeholder="Type here..." class="flex-1 bg-white/5 rounded-xl px-4 py-2 text-xs focus:outline-none border border-white/5">
            <button id="send-btn" class="bg-blue-600 w-10 h-10 rounded-xl flex items-center justify-center">➤</button>
        </div>
    </div>

    <!-- 4. HISTORY -->
    <div id="history" class="screen max-w-md mx-auto">
        <h2 class="text-sm font-black text-blue-500 uppercase mb-4 tracking-widest text-center">📜 Sessions</h2>
        <button id="new-chat-btn" class="w-full bg-blue-600/10 border border-blue-500/20 rounded-xl p-3 text-[10px] font-black mb-4">+ NEW CHAT</button>
        <div id="sessions-list" class="space-y-2"></div>
    </div>

    <!-- NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="nav('home')"><span>🏠</span><span>HOME</span></div>
        <div class="nav-item" onclick="nav('ranks')"><span>🏆</span><span>RANKS</span></div>
        <div class="nav-item" onclick="nav('ai')"><span>🤖</span><span>COACH</span></div>
        <div class="nav-item" onclick="nav('history')"><span>📜</span><span>HISTORY</span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, collection, query, orderBy, limit, getDoc, setDoc, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",
            authDomain: "winter-arc-ba20e.firebaseapp.com",
            projectId: "winter-arc-ba20e",
            storageBucket: "winter-arc-ba20e.appspot.com",
            messagingSenderId: "564956254415",
            appId: "1:564956254415:web:YOUR_ACTUAL_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let userProfile = null;
        let currentSessionId = null;
        let rules = [];
        let msgSub = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await syncUser(user);
                onSnapshot(doc(db, "config", "active_challenge"), (s) => { rules = s.data().rules || []; updateHome(); });
                onSnapshot(doc(db, "users", user.uid), (s) => { 
                    userProfile = s.data(); 
                    document.getElementById('user-points').innerText = userProfile.points;
                    document.getElementById('user-streak').innerText = userProfile.streak;
                    document.getElementById('user-name-display').innerText = userProfile.name;
                    updateHome(); 
                });
                syncSessions(user.uid);
                syncRanks();
            } else {
                signInWithPopup(auth, new GoogleAuthProvider());
            }
        });

        async function syncUser(user) {
            const ref = doc(db, "users", user.uid);
            const s = await getDoc(ref);
            if (!s.exists()) await setDoc(ref, { uid: user.uid, name: user.displayName || "Warrior", points: 0, streak: 0, dailyTaskCounts: {} });
        }

        window.nav = (id) => {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        };

        function updateHome() {
            const container = document.getElementById('tasks-container');
            if(!rules.length) return;
            container.innerHTML = '';
            const today = new Date().getDate().toString();
            const count = (userProfile?.dailyTaskCounts || {})[today] || 0;
            rules.forEach((r, i) => {
                const done = i < count;
                container.innerHTML += `<div class="task-card glass p-3 rounded-xl flex justify-between items-center ${done ? 'done' : ''}"><div class="font-bold text-gray-300 uppercase">${r.text}</div><div class="text-[8px] font-black">${done ? '✓' : ''}</div></div>`;
            });
        }

        function syncSessions(uid) {
            onSnapshot(query(collection(db, "users", uid, "sessions"), orderBy("timestamp", "desc")), (snap) => {
                const list = document.getElementById('sessions-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const div = document.createElement('div');
                    div.className = `glass p-3 rounded-xl cursor-pointer text-[10px] font-bold border-l-4 ${d.id === currentSessionId ? 'border-blue-500' : 'border-transparent'}`;
                    div.innerText = "💬 " + d.data().title;
                    div.onclick = () => { currentSessionId = d.id; syncMsgs(d.id); nav('ai'); };
                    list.appendChild(div);
                });
            });
        }

        function syncMsgs(sid) {
            if(msgSub) msgSub();
            msgSub = onSnapshot(query(collection(db, "users", auth.currentUser.uid, "sessions", sid, "messages"), orderBy("timestamp", "asc")), (snap) => {
                const c = document.getElementById('chat-messages');
                c.innerHTML = '';
                snap.forEach(d => {
                    const m = d.data();
                    const div = document.createElement('div');
                    div.className = `chat-bubble ${m.isUser ? 'self-end bg-blue-600' : 'self-start bg-white/10 border border-white/5'}`;
                    div.innerText = m.text;
                    c.appendChild(div);
                });
                c.scrollTop = c.scrollHeight;
            });
        }

        document.getElementById('send-btn').onclick = async () => {
            const i = document.getElementById('chat-input');
            const msg = i.value.trim();
            if(!msg || !userProfile) return;
            
            const uid = auth.currentUser.uid;
            if(!currentSessionId) {
                const ns = await addDoc(collection(db, "users", uid, "sessions"), { title: msg.substring(0, 15), timestamp: Date.now() });
                currentSessionId = ns.id; syncMsgs(ns.id);
            }
            
            i.value = '';
            const mRef = collection(db, "users", uid, "sessions", currentSessionId, "messages");
            await addDoc(mRef, { text: msg, isUser: true, timestamp: Date.now() });

            // AI CALL (CORS Fix: Use Llama via Groq properly)
            try {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer 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', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: "llama3-8b-8192", messages: [{ role: "user", content: `You are ARC COACH. Speak Hinglish. User: ${userProfile.name}. Question: ${msg}` }] })
                });
                const d = await res.json();
                await addDoc(mRef, { text: d.choices[0].message.content, isUser: false, timestamp: Date.now() });
            } catch (e) { console.error(e); }
        };

        function syncRanks() {
            onSnapshot(query(collection(db, "users"), orderBy("points", "desc"), limit(10)), (snap) => {
                const b = document.getElementById('leaderboard-body'); b.innerHTML = '';
                let r = 1; snap.forEach(d => {
                    b.innerHTML += `<tr class="border-b border-white/5"><td class="py-2 px-3 font-black text-blue-500 w-8">#${r}</td><td class="font-bold">${d.data().name}</td><td class="text-right px-3 font-black opacity-50">${d.data().points} P</td></tr>`;
                    r++;
                });
            });
        }

        document.getElementById('new-chat-btn').onclick = () => { currentSessionId = null; document.getElementById('chat-messages').innerHTML = ''; nav('ai'); };
    </script>
</body>
</html>
