    <style>
        body {
            background: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            font-size: 11px;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .task-card {
            border-left: 3px solid transparent;
            transition: 0.2s;
            margin-bottom: 6px;
            padding: 10px;
            cursor: pointer;
        }

        .task-card:active {
            transform: scale(0.98);
        }

        .done {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
            opacity: 0.8;
        }

        .active-task {
            border-left-color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
        }

        #chat-window {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 280px;
            height: 380px;
            z-index: 100;
            transition: 0.3s;
            transform: translateY(20px);
            opacity: 0;
            pointer-events: none;
        }

        #chat-window.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: all;
        }

        .chat-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            max-width: 85%;
            margin-bottom: 8px;
            font-size: 10px;
            line-height: 1.4;
        }

        ::-webkit-scrollbar {
            width: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }
    </style>
</head>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


        import {
            getFirestore,
            doc,
            onSnapshot,
            collection,
            query,
            orderBy,
            limit,
            getDoc,
            setDoc,
            updateDoc,
            runTransaction
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



        const firebaseConfig = {

            apiKey:
                "AIzaSyCZqTzcU4kK5nkEkB1UcBQlMA-lOv0EPl0",

            authDomain:
                "winter-arc-ba20e.firebaseapp.com",

            projectId:
                "winter-arc-ba20e",

            storageBucket:
                "winter-arc-ba20e.appspot.com",

            messagingSenderId:
                "564956254415",

            appId:
                "1:564956254415:web:YOUR_ACTUAL_APP_ID"

        };



        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const db = getFirestore(app);



        let userProfile = null;

        let activeRules = [];


        const CHALLENGE_START_DATE =
            new Date(2026, 8, 1);



        // ==========================
        // AUTH LISTENER
        // ==========================

        onAuthStateChanged(
            auth,
            async (user) => {

                if (user) {

                    await syncUser(user);



                    // Global Rules

                    onSnapshot(
                        doc(
                            db,
                            "config",
                            "active_challenge"
                        ),

                        (s) => {

                            const globalRules =
                                s.data()?.rules || [];


                            if (
                                !userProfile
                                    ?.customRules
                                    ?.length
                            ) {

                                activeRules =
                                    globalRules;

                                updateChecklist();

                            }

                        }
                    );



                    // User Profile

                    onSnapshot(

                        doc(
                            db,
                            "users",
                            user.uid
                        ),

                        (s) => {

                            userProfile =
                                s.data();


                            if (!userProfile)
                                return;


                            document
                                .getElementById(
                                    "user-points"
                                )
                                .innerText =
                                userProfile.points || 0;


                            document
                                .getElementById(
                                    "user-streak"
                                )
                                .innerText =
                                (
                                    userProfile.streak || 0
                                )
                                + " Days";


                            document
                                .getElementById(
                                    "user-name"
                                )
                                .innerText =
                                userProfile.name
                                || "Warrior";


                            document
                                .getElementById(
                                    "user-initial"
                                )
                                .innerText =
                                (
                                    userProfile.name
                                    || "W"
                                )
                                .charAt(0)
                                .toUpperCase();



                            if (
                                userProfile.customRules
                                &&
                                userProfile.customRules
                                    .length > 0
                            ) {

                                activeRules =
                                    userProfile
                                        .customRules;

                            }


                            updateChecklist();

                        }

                    );


                    syncLeaderboard();

                }

                else {

                    signInWithPopup(
                        auth,
                        new GoogleAuthProvider()
                    );

                }

            }
        );



        // ==========================
        // CREATE USER
        // ==========================

        async function syncUser(user) {

            const ref =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const s =
                await getDoc(ref);


            if (!s.exists()) {

                await setDoc(
                    ref,
                    {

                        uid:
                            user.uid,

                        name:
                            user.displayName
                            || "Warrior",

                        points:
                            0,

                        streak:
                            0,

                        dailyTaskCounts:
                            {},

                        attendance:
                            {},

                        customRules:
                            [],

                        dailyCompletedRules:
                            {}

                    }
                );

            }

        }



        // ==========================
        // TIME FORMAT
        // ==========================

        function format12Hr(t24) {

            if (!t24)
                return "00:00";


            const [h, m] =
                t24.split(":");


            let hr =
                parseInt(h);


            const ampm =
                hr >= 12
                    ? "PM"
                    : "AM";


            hr =
                hr % 12 || 12;


            return `${hr}:${m} ${ampm}`;

        }



        // ==========================
        // STREAK CALCULATION
        // ==========================

        function calculateStreakJS(
            attendance
        ) {

            let currentStreak = 0;

            const now =
                new Date();


            if (
                now
                <
                CHALLENGE_START_DATE
            )
                return 0;


            const todayNum =
                now.getDate();


            for (
                let day = 1;
                day <= todayNum;
                day++
            ) {

                if (
                    attendance[
                        day.toString()
                    ]
                    ===
                    "present"
                ) {

                    currentStreak++;

                }

                else if (
                    day < todayNum
                ) {

                    currentStreak = 0;

                }

            }


            return currentStreak;

        }



        // ==========================
        // COMPLETE RULE
        // ==========================

        window.toggleRuleWeb =
            async (ruleId) => {

                const now =
                    new Date();


                if (
                    now
                    <
                    CHALLENGE_START_DATE
                ) {

                    return alert(
                        "Challenge starts 1st Sept!"
                    );

                }


                const rule =
                    activeRules.find(
                        r =>
                            r.id === ruleId
                    );


                if (!rule)
                    return;



                const today =
                    now
                        .getDate()
                        .toString();


                const currentMins =
                    now.getHours() * 60
                    +
                    now.getMinutes();


                const [sH, sM] =
                    rule
                        .startTime
                        .split(":")
                        .map(Number);


                const [eH, eM] =
                    rule
                        .endTime
                        .split(":")
                        .map(Number);



                if (
                    currentMins
                    <
                    (sH * 60 + sM)
                    ||
                    currentMins
                    >
                    (eH * 60 + eM)
                ) {

                    return alert(
                        "Rule window is not active!"
                    );

                }



                const completedList =
                    userProfile
                        ?.dailyCompletedRules
                        ?.[today]
                    || [];


                if (
                    completedList
                        .includes(ruleId)
                )
                    return;



                const pointsPerRule =
                    Math.floor(
                        100
                        /
                        activeRules.length
                    );


                const pointsToAdd =

                    completedList.length
                    ===
                    activeRules.length - 1

                    ?

                    (
                        100
                        -
                        (
                            pointsPerRule
                            *
                            (
                                activeRules.length
                                - 1
                            )
                        )
                    )

                    :

                    pointsPerRule;



                const userRef =
                    doc(
                        db,
                        "users",
                        auth.currentUser.uid
                    );



                try {

                    await runTransaction(
                        db,
                        async (t) => {


                            const snap =
                                await t.get(
                                    userRef
                                );


                            const data =
                                snap.data();


                            const dailyMap =
                                data
                                    .dailyCompletedRules
                                || {};


                            const todayCompleted =
                                [
                                    ...(
                                        dailyMap[today]
                                        || []
                                    )
                                ];



                            if (
                                !todayCompleted
                                    .includes(ruleId)
                            ) {


                                todayCompleted.push(
                                    ruleId
                                );


                                const newCount =
                                    todayCompleted.length;



                                let updates = {

                                    points:
                                        (
                                            data.points
                                            || 0
                                        )
                                        +
                                        pointsToAdd,


                                    [
                                        `dailyCompletedRules.${today}`
                                    ]:
                                        todayCompleted,


                                    [
                                        `dailyTaskCounts.${today}`
                                    ]:
                                        newCount

                                };



                                if (
                                    newCount
                                    ===
                                    activeRules.length

                                    ||

                                    newCount
                                    >= 5
                                ) {


                                    const att =
                                        data.attendance
                                        || {};


                                    if (
                                        att[today]
                                        !==
                                        "present"
                                    ) {


                                        att[today] =
                                            "present";


                                        updates.attendance =
                                            att;


                                        updates.streak =
                                            calculateStreakJS(
                                                att
                                            );

                                    }

                                }



                                t.update(
                                    userRef,
                                    updates
                                );

                            }

                        }

                    );

                }

                catch (e) {

                    console.error(
                        "Toggle Error:",
                        e
                    );

                }

            };



        // ==========================
        // DELETE RULE
        // ==========================

        window.deleteRuleWeb =
            async (
                e,
                ruleId
            ) => {


                e.stopPropagation();


                if (
                    !confirm(
                        "Do you want delete arc rule?"
                    )
                )
                    return;



                const today =
                    new Date()
                        .getDate()
                        .toString();


                const completedList =
                    userProfile
                        ?.dailyCompletedRules
                        ?.[today]
                    || [];



                let pointsToDeduct =
                    0;



                if (
                    completedList
                        .includes(ruleId)
                ) {


                    const pointsPerRule =
                        Math.floor(
                            100
                            /
                            activeRules.length
                        );


                    pointsToDeduct =

                        completedList.length
                        ===
                        activeRules.length

                        ?

                        (
                            100
                            -
                            (
                                pointsPerRule
                                *
                                (
                                    activeRules.length
                                    - 1
                                )
                            )
                        )

                        :

                        pointsPerRule;

                }



                const updatedRules =
                    activeRules.filter(
                        r =>
                            r.id !== ruleId
                    );


                const userRef =
                    doc(
                        db,
                        "users",
                        auth.currentUser.uid
                    );



                try {

                    await runTransaction(
                        db,
                        async (t) => {


                            const snap =
                                await t.get(
                                    userRef
                                );


                            const data =
                                snap.data();


                            const dailyMap =
                                data
                                    .dailyCompletedRules
                                || {};


                            const todayCompleted =
                                (
                                    dailyMap[today]
                                    || []
                                )
                                .filter(
                                    id =>
                                        id !== ruleId
                                );



                            let updates = {

                                customRules:
                                    updatedRules,


                                [
                                    `dailyCompletedRules.${today}`
                                ]:
                                    todayCompleted,


                                [
                                    `dailyTaskCounts.${today}`
                                ]:
                                    todayCompleted.length

                            };



                            if (
                                pointsToDeduct > 0
                            ) {

                                updates.points =
                                    Math.max(

                                        0,

                                        (
                                            data.points
                                            || 0
                                        )
                                        -
                                        pointsToDeduct

                                    );

                            }



                            t.update(
                                userRef,
                                updates
                            );

                        }
                    );

                }

                catch (err) {

                    console.error(
                        "Delete Error:",
                        err
                    );

                }

            };



        // ==========================
        // CHECKLIST UI
        // ==========================

        function updateChecklist() {

            const container =
                document.getElementById(
                    "tasks-container"
                );


            if (
                !activeRules.length
            ) {

                container.innerHTML =
                    '<div class="text-center py-10 opacity-20 font-black italic">NO RULES SET</div>';

                return;

            }



            container.innerHTML =
                "";


            const today =
                new Date()
                    .getDate()
                    .toString();


            const completedList =
                userProfile
                    ?.dailyCompletedRules
                    ?.[today]
                || [];


            const nowMins =
                new Date()
                    .getHours()
                * 60

                +

                new Date()
                    .getMinutes();



            const pointsPerRule =
                Math.floor(
                    100
                    /
                    activeRules.length
                );



            activeRules.forEach(
                (
                    r,
                    i
                ) => {


                    const [sH, sM] =
                        (
                            r.startTime
                            || "00:00"
                        )
                        .split(":")
                        .map(Number);


                    const [eH, eM] =
                        (
                            r.endTime
                            || "00:00"
                        )
                        .split(":")
                        .map(Number);



                    const isDone =
                        completedList
                            .includes(
                                r.id
                            );



                    const isActive =

                        (
                            new Date()
                            >=
                            CHALLENGE_START_DATE
                        )

                        &&

                        (
                            nowMins
                            >=
                            (
                                sH * 60
                                + sM
                            )
                        )

                        &&

                        (
                            nowMins
                            <=
                            (
                                eH * 60
                                + eM
                            )
                        );



                    const isExpired =

                        nowMins
                        >
                        (
                            eH * 60
                            + eM
                        )

                        &&

                        !isDone;



                    const pts =

                        i
                        ===
                        activeRules.length
                        - 1

                        ?

                        (
                            100
                            -
                            (
                                pointsPerRule
                                *
                                (
                                    activeRules.length
                                    - 1
                                )
                            )
                        )

                        :

                        pointsPerRule;



                    container.innerHTML += `

                        <div
                            class="task-card glass rounded-xl flex justify-between items-center ${
                                isDone
                                    ? "done"
                                    :
                                isActive
                                    ? "active-task"
                                    :
                                isExpired
                                    ? "opacity-30 border-l-red-500"
                                    :
                                    ""
                            }"

                            onclick="${
                                !isDone && isActive
                                    ?
                                    `toggleRuleWeb(${r.id})`
                                    :
                                    ""
                            }"
                        >

                            <div class="flex-1">

                                <div class="font-bold text-gray-100 uppercase text-[10px] tracking-tight">

                                    ${r.text}

                                </div>


                                <div class="text-[8px] text-gray-500 font-mono flex items-center gap-2">

                                    <span>

                                        ${format12Hr(
                                            r.startTime
                                        )}

                                        -

                                        ${format12Hr(
                                            r.endTime
                                        )}

                                    </span>


                                    <span class="text-yellow-500/50">

                                        • ${pts} PTS

                                    </span>

                                </div>

                            </div>


                            <div class="flex items-center gap-3 shrink-0">

                                <div class="text-[8px] font-black uppercase tracking-tighter">

                                    ${
                                        isDone

                                        ?

                                        '<span class="text-blue-400">✓ DONE</span>'

                                        :

                                        isActive

                                        ?

                                        '<span class="text-emerald-500">● LIVE</span>'

                                        :

                                        isExpired

                                        ?

                                        '<span class="text-red-500">✕ MISSED</span>'

                                        :

                                        "WAIT"
                                    }

                                </div>


                                <button
                                    onclick="deleteRuleWeb(event, ${r.id})"
                                    class="p-1 hover:bg-white/5 rounded transition text-[12px]">

                                    🗑️

                                </button>

                            </div>

                        </div>
                    `;

                }

            );

        }



        // ==========================
        // ADD RULE MODAL
        // ==========================

        const modal =
            document.getElementById(
                "add-modal"
            );


        document
            .getElementById(
                "add-rule-btn"
            )
            .onclick =
            () => {

                modal.classList.add(
                    "active"
                );

            };


        document
            .getElementById(
                "cancel-add"
            )
            .onclick =
            () => {

                modal.classList.remove(
                    "active"
                );

            };



        document
            .getElementById(
                "save-rule"
            )
            .onclick =
            async () => {


                const text =
                    document
                        .getElementById(
                            "rule-text"
                        )
                        .value
                        .trim();


                const start =
                    document
                        .getElementById(
                            "rule-start"
                        )
                        .value;


                const end =
                    document
                        .getElementById(
                            "rule-end"
                        )
                        .value;



                if (
                    !text
                    ||
                    !start
                    ||
                    !end
                ) {

                    return alert(
                        "Please fill all fields!"
                    );

                }



                const newRule = {

                    id:
                        Date.now(),

                    text:
                        text,

                    startTime:
                        start,

                    endTime:
                        end

                };



                const updatedRules =
                    [
                        ...activeRules,
                        newRule
                    ];



                await updateDoc(

                    doc(
                        db,
                        "users",
                        auth.currentUser.uid
                    ),

                    {

                        customRules:
                            updatedRules

                    }

                );



                modal.classList.remove(
                    "active"
                );


                document
                    .getElementById(
                        "rule-text"
                    )
                    .value =
                    "";

            };



        // ==========================
        // LEADERBOARD
        // ==========================

        function syncLeaderboard() {


            const q =
                query(

                    collection(
                        db,
                        "users"
                    ),

                    orderBy(
                        "points",
                        "desc"
                    ),

                    limit(10)

                );



            onSnapshot(
                q,
                (snap) => {


                    const b =
                        document
                            .getElementById(
                                "leaderboard-body"
                            );


                    b.innerHTML =
                        "";


                    let rank =
                        1;



                    snap.forEach(
                        d => {


                            const data =
                                d.data();


                            const isSelf =
                                data.uid
                                ===
                                auth
                                    .currentUser
                                    ?.uid;



                            b.innerHTML += `

                                <tr class="border-b border-white/5 ${
                                    isSelf
                                        ?
                                        "bg-blue-500/5"
                                        :
                                        ""
                                }">

                                    <td class="py-2.5 pr-2 font-bold w-8 text-center ${
                                        rank <= 3
                                            ?
                                            "text-yellow-500"
                                            :
                                            "text-blue-500/50"
                                    }">

                                        #${rank}

                                    </td>


                                    <td class="py-2.5 font-bold text-gray-200">

                                        ${
                                            data.name
                                            ||
                                            "Warrior"
                                        }

                                        ${
                                            isSelf

                                            ?

                                            '<span class="text-[7px] bg-blue-500 text-white px-1 rounded ml-1">YOU</span>'

                                            :

                                            ""
                                        }

                                    </td>


                                    <td class="py-2.5 text-right font-black text-emerald-500 opacity-60">

                                        ${
                                            data.points
                                            ||
                                            0
                                        } P

                                    </td>

                                </tr>
                            `;


                            rank++;

                        }
                    );

                }
            );

        }



        // ==========================
        // TIMER
        // ==========================

        function updateTimer() {


            const diff =
                CHALLENGE_START_DATE
                -
                new Date();


            const display =
                document
                    .getElementById(
                        "countdown-timer"
                    );



            if (
                diff > 0
            ) {


                const d =
                    Math.floor(
                        diff / 86400000
                    );


                const h =
                    Math.floor(
                        (
                            diff / 3600000
                        )
                        %
                        24
                    );


                const m =
                    Math.floor(
                        (
                            diff / 60000
                        )
                        %
                        60
                    );


                const s =
                    Math.floor(
                        (
                            diff / 1000
                        )
                        %
                        60
                    );



                display.innerText =

                    `${String(d).padStart(2,"0")}d : `

                    +

                    `${String(h).padStart(2,"0")}h : `

                    +

                    `${String(m).padStart(2,"0")}m : `

                    +

                    `${String(s).padStart(2,"0")}s`;

            }

            else {


                display.innerText =
                    "WINTER ARC IS LIVE!";


                display.classList.add(
                    "animate-pulse"
                );

            }

        }



        // ==========================
        // AI COACH
        // ==========================

        async function askCoach() {


            const input =
                document
                    .getElementById(
                        "chat-input"
                    );


            const msg =
                input
                    .value
                    .trim();



            if (
                !msg
                ||
                !userProfile
            )
                return;



            appendMsg(
                msg,
                true
            );


            input.value =
                "";



            const loadingId =
                "L-"
                +
                Date.now();



            appendMsg(
                "...",
                false,
                loadingId
            );



            try {


                const response =
                    await fetch(

                        "https://winter.gupta07animesh.workers.dev/",

                        {

                            method:
                                "POST",

                            headers:
                                {

                                    "Content-Type":
                                        "application/json"

                                },

                            body:
                                JSON.stringify(
                                    {

                                        message:
                                            msg,

                                        name:
                                            userProfile.name

                                    }
                                )

                        }

                    );



                const data =
                    await response.json();



                document
                    .getElementById(
                        loadingId
                    )
                    .innerText =

                    data.reply

                    ||

                    "Coach is busy!";

            }

            catch (error) {


                document
                    .getElementById(
                        loadingId
                    )
                    .innerText =

                    "Coach is offline.";

            }

        }



        function appendMsg(
            t,
            u,
            id
        ) {


            const d =
                document
                    .createElement(
                        "div"
                    );


            d.className =

                `chat-bubble ${
                    u

                    ?

                    "self-end bg-blue-600 text-white shadow-lg"

                    :

                    "self-start bg-white/10 border border-white/5 text-gray-300"
                }`;



            if (id)
                d.id =
                    id;


            d.innerText =
                t;



            const c =
                document
                    .getElementById(
                        "chat-messages"
                    );


            c.appendChild(
                d
            );


            c.scrollTop =
                c.scrollHeight;

        }



        // ==========================
        // BUTTON EVENTS
        // ==========================

        document
            .getElementById(
                "chat-toggle"
            )
            .onclick =
            () => {

                document
                    .getElementById(
                        "chat-window"
                    )
                    .classList
                    .toggle(
                        "active"
                    );

            };



        document
            .getElementById(
                "send-btn"
            )
            .onclick =
            askCoach;



        document
            .getElementById(
                "chat-input"
            )
            .onkeydown =
            (e) => {

                if (
                    e.key
                    ===
                    "Enter"
                ) {

                    askCoach();

                }

            };



        document
            .getElementById(
                "edit-name-btn"
            )
            .onclick =
            async () => {


                const n =
                    prompt(

                        "Change your Warrior name:",

                        userProfile?.name

                    );



                if (
                    n
                    &&
                    n.trim()
                ) {

                    await updateDoc(

                        doc(
                            db,
                            "users",
                            auth
                                .currentUser
                                .uid
                        ),

                        {

                            name:
                                n.trim()

                        }

                    );

                }

            };



        document
            .getElementById(
                "logout-btn"
            )
            .onclick =
            () => {


                if (
                    confirm(
                        "Logout?"
                    )
                ) {

                    signOut(
                        auth
                    );

                }

            };



        setInterval(
            updateTimer,
            1000
        );


        updateTimer();

    </script>

</body>
</html>
